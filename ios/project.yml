name: Marquee
options:
  bundleIdPrefix: com.bryanstage
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Marquee:
    type: application
    platform: iOS
    sources:
      - path: Marquee
      - path: ../data/los-angeles.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bryanstage.marquee
        DEVELOPMENT_TEAM: V7YN565TXP
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: Marquee/Info.plist
      properties:
        CFBundleDisplayName: Marquee
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppleMusicUsageDescription: Marquee reads the artists in your library to find their shows and similar bands near you.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.bryanstage.marquee.refresh]
