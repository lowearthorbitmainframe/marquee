name: Marquee
options:
  bundleIdPrefix: com.bryanstage
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Marquee:
    type: application
    platform: iOS
    sources:
      - path: Marquee
      - path: ../data/los-angeles.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bryanstage.marquee
        DEVELOPMENT_TEAM: V7YN565TXP
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Marquee/Scenester.entitlements
    info:
      path: Marquee/Info.plist
      properties:
        CFBundleDisplayName: Scenester
        # iOS shows this name in permission prompts such as "wants to use spotify.com to sign in".
        CFBundleName: Scenester
        # Read from build settings so each TestFlight upload can carry its own build number.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppleMusicUsageDescription: Scenester reads the artists in your library to find their shows and similar bands near you.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.bryanstage.marquee.refresh]
        # Only HTTPS through Apple's own networking, so no export compliance paperwork is needed.
        ITSAppUsesNonExemptEncryption: false
        SuggestionsUseCloudKit: true
        # From the Spotify app at developer.spotify.com; the Import from Spotify button stays hidden while it's empty.
        SpotifyClientID: "505e4293b99b46d2b51aaeb489da271c"
