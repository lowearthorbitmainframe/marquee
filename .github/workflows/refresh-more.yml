name: Refresh listings (more cities)

# The regions marked "second_run" in scraper/venues.py (Seattle, Portland, Las Vegas, Denver,
# Austin, Phoenix, Detroit, New York). Runs three hours after the main refresh so the two
# never overlap, since both update data/artists.json.
on:
  schedule:
    - cron: "47 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listings
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scrape.py --second-run --budget 120 --minutes 4 --link-minutes 3
        working-directory: scraper
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
      - name: Publish
        run: |
          git config user.name "marquee-bot"
          git config user.email "marquee-bot@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "Refresh listings (more cities)"
          git pull --rebase -X theirs origin main
          git push
