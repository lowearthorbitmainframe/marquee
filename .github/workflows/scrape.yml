name: Refresh listings

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest test_titles
        working-directory: scraper
      - run: python scrape.py --budget 150 --minutes 12 --link-minutes 10
        working-directory: scraper
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
      - name: Publish
        run: |
          git config user.name "marquee-bot"
          git config user.email "marquee-bot@users.noreply.github.com"
          git add data/los-angeles.json data/artists.json
          git diff --cached --quiet || git commit -m "Refresh listings"
          # Code may have been pushed during the run; keep this run's fresh listings.
          git pull --rebase -X theirs origin main
          git push
